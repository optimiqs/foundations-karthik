name: Progress

on:
  push:
    branches: [main]
  pull_request:

jobs:
  progress:
    runs-on: [self-hosted, linux, arm64, optimiqs, 2vcpu, 8gb, "${{ github.event_name == 'push' && 'optimiqs-cache-trusted' || 'optimiqs-cache-untrusted' }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm progress --markdown >> "$GITHUB_STEP_SUMMARY"
